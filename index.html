
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operating Systems Lab & Resources Index</title>
    <style>
        :root {
            --primary-color: #2a2e43;
            --accent-color: #00adb5;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        .hero-banner {
            background: linear-gradient(rgba(42, 46, 67, 0.85), rgba(42, 46, 67, 0.9)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: #ffffff; padding: 60px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .hero-banner h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero-banner p { font-size: 1.1rem; opacity: 0.9; margin-bottom: 20px; }
        .professor-badge { display: inline-block; background: rgba(0, 173, 181, 0.2); border: 1px solid var(--accent-color); padding: 8px 20px; border-radius: 50px; font-weight: 600; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-bar { padding: 12px 20px; width: 100%; max-width: 400px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; }
        .search-bar:focus { border-color: var(--accent-color); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { 
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            padding: 24px; transition: transform 0.3s; display: flex; flex-direction: column; 
            justify-content: space-between; border-top: 4px solid var(--accent-color); 
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .card-title { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 12px; font-weight: 600; }
        .card-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; font-family: monospace; }
        .card-btn { display: inline-block; text-align: center; background-color: var(--primary-color); color: #fff; padding: 10px 15px; border-radius: 6px; text-decoration: none; font-weight: 500; }
        .card-btn:hover { background-color: var(--accent-color); }

        footer { text-align: center; padding: 40px 20px; margin-top: 60px; color: var(--text-muted); border-top: 1px solid #e0e0e0; }
    </style>
</head>
<body>

    <header class="hero-banner">
        <h1>Operating Systems Repository Index</h1>
        <p>Core operational algorithms, lab exercises, and system paradigms.</p>
        <div class="professor-badge">Mentor: Dr. Nitin Mishra</div>
    </header>

    <main class="container">
        <div class="controls">
            <input type="text" id="search" class="search-bar" placeholder="Search files...">
        </div>

        <div id="index-grid" class="grid">
            </div>
    </main>

    <footer>
        &copy; 2026 | Designed for OS Educational Resource Management
    </footer>

    <script>
        // Simple client-side filtering logic
        const searchInput = document.getElementById('search');
        const cards = document.querySelectorAll('.card');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                const path = card.querySelector('.card-meta').textContent.toLowerCase();
                if (title.includes(query) || path.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
